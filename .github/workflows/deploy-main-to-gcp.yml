name: re-deploy-main-to-gcp.yml

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
          SSH_USER: haydenknight888
          SSH_HOST: 34.19.146.154
          APP_DIR: fullstack-brain-bucket/server
          PM2_NAME: app
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          eval "$(ssh-agent -s)"
          printf '%s\n' "$SSH_KEY_PASSPHRASE" | ssh-add ~/.ssh/deploy_key

          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

          ssh "$SSH_USER@$SSH_HOST" <<EOF
            set -e

            cd "$APP_DIR"

            git pull
            npm ci

            pm2 restart "$PM2_NAME" || pm2 start app.mjs --name "$PM2_NAME"

            pm2 save
          EOF
